{% extends "base.html" %}
{% block title %}Editar venda{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Editar venda</h1>

<form method="post" class="col-lg-6">
  <div class="row g-2">
    <div class="col-12 col-sm-6">
      <label class="form-label">Data</label>
      <input type="date" name="data" class="form-control" value="{{ venda.data.strftime('%Y-%m-%d') }}">
    </div>
    <div class="col-12 col-sm-6">
      <label class="form-label">Comprador</label>
      <input type="text" name="comprador" class="form-control" value="{{ venda.comprador }}" required>
    </div>
    <div class="col-6">
      <label class="form-label">Quantidade</label>
      <input type="number" name="quantidade" class="form-control" value="{{ venda.quantidade }}" required>
    </div>
    <div class="col-6">
      <label class="form-label">Valor unitário</label>
      <input type="number" step="0.01" name="valor_unitario" class="form-control" value="{{ venda.valor_unitario }}" required>
    </div>
    <div class="col-6 col-sm-4">
      <label class="form-label">Frete</label>
      <input type="number" step="0.01" name="frete" class="form-control" value="{{ venda.frete }}">
    </div>
    <div class="col-6 col-sm-4">
      <label class="form-label">Comissão</label>
      <input type="number" step="0.01" name="comissao" class="form-control" value="{{ venda.comissao }}">
    </div>
    <div class="col-12 col-sm-4">
      <label class="form-label">GTA</label>
      <input type="number" step="0.01" name="gta" class="form-control" value="{{ venda.gta }}">
    </div>
  </div>
  <button type="submit" class="btn btn-primary mt-3">Salvar</button>
  <a href="{{ url_for('lotes.detalhe', lote_id=venda.lote_id) }}" class="btn btn-link mt-3">Cancelar</a>
</form>
{% endblock %}
